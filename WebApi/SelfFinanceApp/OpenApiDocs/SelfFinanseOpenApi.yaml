components:
  responses:
    UnexpectedError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnexpectedError'
          examples:
            ErrorMessage:
              $ref: '#/components/examples/UnexpectedError'

  parameters:
    id:
      name: id
      in: path
      description: Identificator for get one item
      required: true
      schema:
        type: integer
      example: 23
      
    startDate:
      name: startDate
      in: query
      description: Start date period for report
      required: true
      schema:
        type: string
      example: 20240301
    endDate:
      name: endDate
      in: query
      description: End date period for report
      required: false
      schema:
        type: string
      example: 20240331
    toDate:
      name: toDate
      in: path
      description: To entered date for report
      required: true
      schema:
        type: string
      example: 20240724  
        
  schemas:
    Incomes:
      title: Incomes
      type: array
      items:
        $ref: '#/components/schemas/Income'
          
    Income:
      title: Income
      type: object
      properties:
        typeIncome:
          type: object
          description: Master Table
        id:
          $ref: '#/components/schemas/id'
        amount: 
          $ref: '#/components/schemas/amount'
        createDate:
          $ref: '#/components/schemas/createDate'
        updateDate:
          $ref: '#/components/schemas/updateDate'
        typeId:
          $ref: '#/components/schemas/typeId'
        comments: 
          $ref: '#/components/schemas/comments'
    
    Expenses:
      title: Expenses
      type: array
      items:
        $ref: '#/components/schemas/Expense'
          
    Expense:
      title: Expense
      type: object
      properties:
        typeExpense:
          type: object
          description: Master Table
        id:
          $ref: '#/components/schemas/id'
        amount: 
          $ref: '#/components/schemas/amount'
        createDate:
          $ref: '#/components/schemas/createDate'
        updateDate:
          $ref: '#/components/schemas/updateDate'
        typeId:
          $ref: '#/components/schemas/typeId'
        comments: 
          $ref: '#/components/schemas/comments'
          
    TypesIncomes:
