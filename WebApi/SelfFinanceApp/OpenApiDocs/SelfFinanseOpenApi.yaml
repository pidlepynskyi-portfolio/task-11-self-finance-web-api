      type: array
      items:
        $ref: '#/components/schemas/TypeIncomes'
    
    TypeIncomes:
      title: Type Incomes
      type: object
      properties:
        incomes:
          type: object
          description: Detail table
        id:
          $ref: '#/components/schemas/id'
        name:
          $ref: '#/components/schemas/name'
        description:
          $ref: '#/components/schemas/description'
        createDate:
          $ref: '#/components/schemas/createDate'
        updateDate:
          $ref: '#/components/schemas/updateDate'
          
    TypesExpenses:
      title: Types Expenses
      type: array
      items:
        $ref: '#/components/schemas/TypeExpenses'    
    
    TypeExpenses:
      title: Type Expenses
      type: object
      properties:
        incomes:
          type: object
          description: Detail table
        id:
          $ref: '#/components/schemas/id'
        name:
          $ref: '#/components/schemas/name'
        description:
          $ref: '#/components/schemas/description'
        createDate:
          $ref: '#/components/schemas/createDate'
        updateDate:
          $ref: '#/components/schemas/updateDate'
          
    Report:
      title: Report by period
      type: object
      properties:
        incomeReport:
          $ref: '#/components/schemas/incomeReport'
        expenseReport:
          $ref: '#/components/schemas/expenseReport'

    incomeReport:
      title: IncomeReport object
      type: object
      properties:
        incomeSum:
          type: number
          description: sum income by period
        listIncomeOperations:
          $ref: '#/components/schemas/listIncomeOperations'

    listIncomeOperations:
      title: List Income Operations
      type: array
      items:
        $ref: '#/components/schemas/Income'

    expenseReport:
      title: ExpenseReport object
      type: object
      properties:
        expenseSum:
          type: number
          description: sum expense by period
        listExpenseOperations:
          $ref: '#/components/schemas/listExpenseOperations'

    listExpenseOperations:
      title: List Expense Operations
      type: array
      items:
        $ref: '#/components/schemas/Expense'
          
    
    400_IncorrectDate:
      title: 400 Incorrect date
      type: object
      properties:
        message:
          $ref: '#/components/schemas/message'
    
    404_NotFound:
      title: 404 Not Found
      type: object
      properties:
        message:
          $ref: '#/components/schemas/message'
          
    UnexpectedError:
      title: Unexpected error
      type: object
      properties:
        message:
          $ref: '#/components/schemas/message'
        
    id:
      type: integer
      description: Identificator item auto generate
    amount:
      type: number
      description: amount item
    createDate:
      type: string
      description: create date auto added
    updateDate:
